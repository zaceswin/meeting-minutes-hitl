<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minutes review</title>
<style>
  :root { --bg:#fafaf8; --fg:#1d1d1b; --mut:#6b6b66; --line:#dcdcd5; --card:#fff; --ok:#1f7a3d; --no:#a33; --warn:#b26a00; --acc:#2455a4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ececea; --mut:#9a9a94; --line:#33332f; --card:#1f1f1d; --ok:#5ec27f; --no:#e07070; --warn:#e0a040; --acc:#7aa7f0; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; padding-bottom:64px; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  header h1 { font-size:16px; margin:0; }
  #banner { padding:8px 16px; font-weight:600; display:none; }
  #banner.show { display:block; background:#fdecc8; color:#5a3b00; }
  main { display:grid; grid-template-columns: 45% 55%; height:calc(100vh - 110px); }
  section { overflow:auto; padding:12px 16px; }
  #left { border-right:1px solid var(--line); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:18px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:6px; padding:8px 10px; margin-bottom:8px; }
  .card.accepted { border-left-color:var(--ok); } .card.rejected { border-left-color:var(--no); opacity:.55; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:4px; }
  .tag, .flag { font-size:11px; padding:1px 6px; border-radius:9px; border:1px solid var(--line); color:var(--mut); }
  .flag { border-color:var(--warn); color:var(--warn); }
  blockquote { margin:6px 0; padding-left:8px; border-left:2px solid var(--line); color:var(--mut); font-style:italic; }
  button { font:inherit; font-size:12px; padding:2px 8px; border:1px solid var(--line); border-radius:5px; background:var(--card); color:var(--fg); cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.lnk { border:none; color:var(--acc); padding:0 4px; font-style:normal; }
  .line { display:flex; gap:8px; padding:3px 4px; border-radius:4px; align-items:baseline; }
  .line .t { color:var(--mut); font-variant-numeric:tabular-nums; min-width:46px; }
  .line .sp { font-weight:600; min-width:92px; }
  .line .tx { flex:1; }
  .line .conf { font-size:11px; color:var(--mut); }
  .line.unrel .tx { background:#fdecc8; color:#5a3b00; }
  .line.cand { box-shadow: inset 3px 0 0 var(--acc); }
  .line.hit { background:#cfe1ff; color:#111; }
  .line .ops { visibility:hidden; display:flex; gap:3px; }
  .line:hover .ops { visibility:visible; }
  .spk { display:flex; gap:6px; align-items:center; margin:4px 0; }
  input[type=text] { font:inherit; padding:3px 6px; border:1px solid var(--line); border-radius:5px; background:var(--card); color:var(--fg); }
  #bar { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); padding:6px 12px; display:flex; gap:12px; align-items:center; }
  #bar audio { flex:1; height:36px; }
  pre#prev { white-space:pre-wrap; background:var(--card); border:1px solid var(--line); padding:8px; border-radius:6px; font-size:12px; }
  .legend { color:var(--mut); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Minutes review</h1>
  <label>Reviewer <input type="text" id="reviewer" placeholder="your name"></label>
  <button id="btnPrev">Preview minutes</button>
  <button id="btnExport"><b>Export to Markdown</b></button>
  <span id="msg" class="legend"></span>
</header>
<div id="banner"></div>
<main>
  <section id="left"></section>
  <section id="right"></section>
</main>
<div id="bar"><span class="legend">Click any ▶ or line ID to hear that line.</span><audio id="player" controls preload="metadata" src="/api/audio"></audio></div>
<script>
const $ = s => document.querySelector(s);
let S = null, stopAt = null;
const player = $('#player');
player.addEventListener('timeupdate', () => { if (stopAt !== null && player.currentTime >= stopAt) { player.pause(); stopAt = null; } });

async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const d = j.detail; throw new Error(typeof d === 'string' ? d : JSON.stringify(d || r.statusText)); }
  return j;
}
// All text goes through textContent (el/append): transcript text can never inject HTML.
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids) e.append(k);
  return e;
}
const hms = s => { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); };
const spk = l => l.speaker ? (S.session.speakers[l.speaker] || l.speaker) : '?';

function play(id) {
  const l = S.session.lines.find(x => x.id === id); if (!l) return;
  player.currentTime = Math.max(0, l.start - 0.5); stopAt = l.end + 0.5; player.play();
  const row = document.getElementById(id);
  if (row) { row.scrollIntoView({ block: 'center', behavior: 'smooth' }); row.classList.add('hit'); setTimeout(() => row.classList.remove('hit'), 1500); }
}
async function act(fn) { try { await fn(); await load(); } catch (e) { alert(e.message); } }
async function load() { S = await api('/api/session'); render(); }

function itemCard(it) {
  const card = el('div', { class: 'card ' + it.status });
  card.append(el('div', { class: 'row' }, el('b', {}, it.id), el('span', { class: 'tag' }, it.origin), ...it.flags.map(f => el('span', { class: 'flag' }, f))));
  card.append(el('div', {}, it.text));
  if (it.kind === 'action') card.append(el('div', {}, 'Owner: ', el('b', {}, it.owner || 'UNASSIGNED'), it.owner && !it.owner_confirmed ? ' (unconfirmed: check the audio)' : ''));
  if (it.positions.length) card.append(el('ul', {}, ...it.positions.map(p => el('li', {}, p))));
  for (const ev of it.evidence) card.append(el('blockquote', {}, '“' + ev.quote + '” ', el('button', { class: 'lnk', onclick: () => play(ev.line_id) }, '▶ ' + ev.line_id)));
  const patch = body => act(() => api('/api/items/' + it.id, 'PATCH', body));
  const row = el('div', { class: 'row' },
    el('button', { onclick: () => patch({ status: 'accepted' }) }, '✓ Accept'),
    el('button', { onclick: () => patch({ status: 'rejected' }) }, '✗ Reject'),
    el('button', { onclick: () => patch({ status: 'pending' }) }, 'Reset'),
    el('button', { onclick: () => { const t = prompt('Edit text', it.text); if (t !== null) patch({ text: t }); } }, 'Edit'));
  if (it.kind === 'action') row.append(el('button', { onclick: () => { const o = prompt('Owner (blank = unassigned)', it.owner || ''); if (o !== null) patch({ owner: o }); } }, 'Owner'));
  if (it.flags.includes('QUOTE_MISMATCH')) row.append(el('button', { onclick: () => patch({ requote: true }) }, 'Re-quote from corrected line'));
  card.append(row);
  return card;
}

function lineRow(l) {
  const cand = S.uncovered.includes(l.id);
  const row = el('div', { class: 'line' + (l.unreliable ? ' unrel' : '') + (cand ? ' cand' : ''), id: l.id });
  row.append(el('span', { class: 't' }, hms(l.start)), el('span', { class: 'sp' }, spk(l)), el('span', { class: 'tx' }, (cand ? '⚑ ' : '') + l.text));
  row.append(el('span', { class: 'conf' }, l.confidence === null ? 'n/a' : Math.round(l.confidence * 100) + '%'));
  const add = (kind, label) => el('button', { title: 'Add as ' + kind, onclick: () => {
    const t = prompt(label + ' (short statement):', l.text); if (t) act(() => api('/api/items', 'POST', { kind, text: t, line_id: l.id }));
  } }, label);
  row.append(el('span', { class: 'ops' },
    el('button', { onclick: () => play(l.id) }, '▶'),
    el('button', { title: 'Correct what the machine heard', onclick: () => {
      const t = prompt('Correct text for ' + l.id + ':', l.text); if (t === null || t === l.text) return;
      const k = prompt('Error type? (mishear / number / name / language / dropped / crosstalk / other)', 'mishear') || 'other';
      act(() => api('/api/lines/' + l.id, 'PUT', { text: t, error_type: k }));
    } }, '✎'),
    add('decision', '+D'), add('action', '+A'), add('open_issue', '+O')));
  return row;
}

function render() {
  const s = S.session;
  $('#title').textContent = 'Minutes review: ' + s.name + ' (' + s.meeting_date + ')';
  $('#reviewer').value = $('#reviewer').value || s.reviewer;
  const b = $('#banner');
  if (s.mode === 'manual_review_required' || s.notes.length) {
    b.className = 'show'; b.textContent = s.notes.join('  |  ');
  } else b.className = '';
  const L = $('#left'); L.replaceChildren();
  L.append(el('div', { class: 'legend' }, 'Unreliable lines are highlighted. ⚑ marks decision-like lines no item cites (possible misses). ' + (S.blockers.length ? 'Export blocked: ' + S.blockers.join(' ') : 'Ready to export.')));
  for (const [kind, title] of [['decision', 'Decisions'], ['action', 'Actions'], ['open_issue', 'Left open (not decided)']]) {
    L.append(el('h2', {}, title));
    const items = s.items.filter(i => i.kind === kind);
    if (!items.length) L.append(el('div', { class: 'legend' }, 'None. Use +D / +A / +O on a transcript line to add one.'));
    items.forEach(i => L.append(itemCard(i)));
  }
  const R = $('#right'); R.replaceChildren();
  R.append(el('h2', {}, 'Speakers'));
  const labels = [...new Set(s.lines.map(l => l.speaker).filter(Boolean))].sort();
  if (!labels.length) R.append(el('div', { class: 'legend' }, 'No speaker labels (diarization was off or failed).'));
  for (const lab of labels) {
    const inp = el('input', { type: 'text', placeholder: 'name' }); inp.value = s.speakers[lab] || '';
    inp.addEventListener('change', () => act(() => api('/api/speakers', 'PUT', { [lab]: inp.value })));
    R.append(el('div', { class: 'spk' }, el('code', {}, lab), '→', inp));
  }
  R.append(el('h2', {}, 'Transcript'));
  s.lines.forEach(l => R.append(lineRow(l)));
}

$('#btnPrev').onclick = async () => {
  try {
    const p = await api('/api/preview'); const old = $('#prev'); if (old) old.remove();
    $('#left').prepend(el('pre', { id: 'prev' }, (p.blockers.length ? 'BLOCKED: ' + p.blockers.join(' ') + '\n\n' : '') + p.markdown));
  } catch (e) { alert(e.message); }
};
$('#btnExport').onclick = async () => {
  try {
    const r = await api('/api/export', 'POST', { reviewer: $('#reviewer').value, include_transcript: false });
    $('#msg').textContent = 'Exported: ' + r.minutes + ' and ' + r.register;
  } catch (e) { alert('Export blocked: ' + e.message); }
  load();
};
load();
</script>
</body>
</html>
