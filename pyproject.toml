[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-minutes-hitl"
version = "0.1.0"
description = "Audio -> transcript -> evidence-quoted minutes, with a mandatory human review gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "anthropic>=0.40",
]

[project.optional-dependencies]
asr = ["whisperx"]            # heavy (torch). Needed only for `minutes run`
dev = ["pytest>=8"]

[project.scripts]
minutes = "minutes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minutes = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
